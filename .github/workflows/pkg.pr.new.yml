name: PKG PR New

# Publishes an installable preview build of each package per commit, so the blueprint app
# can be pointed at a branch and validated end to end before anything is released to a
# permanently version-burned npm version.
#
# PARKED: this needs the pkg.pr.new GitHub App installed on the repository. Without it the
# publish step fails with `There is no workflow defined for <id>` (HTTP 404). Install it at
# https://github.com/apps/pkg-pr-new and then restore the triggers below to:
#
#   on:
#     workflow_dispatch:
#     pull_request:
#       types: [opened, synchronize, ready_for_review]
#     push:
#       branches: [main]
on:
  workflow_dispatch:

jobs:
  build:
    name: Publish preview packages
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes an installable tarball per package for this commit, so the blueprint
      # app can be pointed at a branch and validated end to end before anything is
      # released to a real, permanently version-burned npm release.
      - name: Publish preview
        run: pnpm dlx pkg-pr-new publish --pnpm --compact './packages/*'
