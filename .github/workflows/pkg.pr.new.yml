name: PKG PR New

# Publishes an installable preview build of each package per commit, so the blueprint app
# can be pointed at a branch and validated end to end before anything is released to a
# permanently version-burned npm version.
#
# Needs the pkg.pr.new GitHub App on the repository (https://github.com/apps/pkg-pr-new).
# Without it the publish step fails with `There is no workflow defined for <id>` (HTTP 404).
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    name: Publish preview packages
    # Only pull requests carry a draft flag. A push to main or a manual run always publishes.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes an installable tarball per package for this commit, so the blueprint
      # app can be pointed at a branch and validated end to end before anything is
      # released to a real, permanently version-burned npm release. No --compact: compact
      # URLs resolve through npm, so they fail for a package that has never been released.
      - name: Publish preview
        run: pnpm dlx pkg-pr-new publish --pnpm './packages/*'
